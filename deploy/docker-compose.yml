# Deploy-host file. Copy this file and a filled-in .env (see .env.example in the repo)
# to the deploy host — no git checkout of the source repo is needed.
#
# Usage on the deploy host:
#   docker compose pull
#   docker compose up -d

services:
  newsletter-digest:
    image: ghcr.io/cervantesvive/newsletter-digest:latest # pin to a release tag before going live
    restart: unless-stopped
    env_file: .env
    ports:
      # There is no auth built into this app — restrict access however fits your
      # deployment (bind to a specific interface, put it behind a reverse proxy with
      # auth, a VPN, a firewall rule, etc). Adjust the host-side binding as needed.
      - "3000:3000"
    volumes:
      - digest-data:/app/data

volumes:
  digest-data:
